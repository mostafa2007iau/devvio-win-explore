name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install 7-Zip and Inno Setup
        shell: pwsh
        run: choco install 7zip innosetup -y --no-progress

      - name: Build
        shell: pwsh
        run: ./scripts/build.ps1 -Configuration Release

      - name: Report failure details
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $log = if (Test-Path build.log) { (Get-Content build.log -Tail 120) -join "`n" } else { "build.log was not created" }
          $fence = [string][char]96 * 3
          $body = "CI build failed on commit ${{ github.sha }}.`n`n$fence`n$log`n$fence"
          $posted = $false
          try {
            gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -f body="$body" | Out-Null
            $posted = $true
          } catch { }
          if (-not $posted) {
            gh api "repos/${{ github.repository }}/issues" -f title="CI build failure ${{ github.sha }}" -f body="$body" | Out-Null
          }

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: DevvioArchiver-Setup
          path: dist/DevvioArchiver-Setup-*.exe
          if-no-files-found: warn

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: DevvioArchiver-portable
          path: dist/DevvioArchiver-*-portable.zip
          if-no-files-found: warn

      - name: Publish release with binaries
        if: success() && (github.ref == 'refs/heads/arena/01a0da8c-devvio-win-explore' || github.ref == 'refs/heads/main')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v1.0.0"
          $files = @()
          foreach ($pattern in @('dist/DevvioArchiver-Setup-*.exe', 'dist/DevvioArchiver-*-portable.zip')) {
            $found = Get-ChildItem $pattern -ErrorAction SilentlyContinue
            if ($found) { $files += $found.FullName }
          }
          if ($files.Count -eq 0) { Write-Host "No files to release"; exit 0 }
          Write-Host "Release files:"; $files | ForEach-Object { Write-Host " - $_" }
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag @files --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title "Devvio Archiver 1.0.0" `
              --notes "Archive support for Windows Explorer (7z, RAR, tar/gz/bz2/xz, cab, iso, wim, lzh, arj, cpio, deb, rpm, split volumes, AES encryption).

DevvioArchiver-Setup-1.0.0.exe - full installer (run as Administrator; restarts Explorer when done).
DevvioArchiver-1.0.0-portable.zip - portable build (extract anywhere, run scripts\register.cmd as Administrator).

Windows 10/11, .NET Framework 4.8 (preinstalled on up-to-date systems). On Windows 11 the context menu entries appear under 'Show more options' (Shift+F10)."
          } else {
            gh release upload $tag @files --repo $env:GITHUB_REPOSITORY --clobber
          }
